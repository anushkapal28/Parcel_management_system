server:
  port: 8083
spring:
  application:
    name: tracking-service
  datasource:
    url: jdbc:mysql://localhost:3306/tracking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-a-long-random-string-min-32-chars}
  internal-key: ${INTERNAL_KEY:internal-service-key-123}
